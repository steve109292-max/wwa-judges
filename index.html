<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WWA Prize — Deliberation Board</title>
<style>
:root{
  --ink:#111418; --ink2:#3a4149; --muted:#6b7280; --line:#e3e6ea; --line2:#f0f2f5;
  --bg:#ffffff; --panel:#f7f8fa;
  --green:#15803d; --greenbg:#dcfce7; --greenline:#86efac;
  --red:#b91c1c;   --redbg:#fee2e2;   --redline:#fca5a5;
  --gold:#a16207;  --goldbg:#fef3c7;
  --amber:#d97706;
  --scale:1;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:400 calc(15px * var(--scale))/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}

/* ---------- chrome ---------- */
header{display:flex;align-items:baseline;gap:16px;padding:14px 26px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:calc(13px * var(--scale));letter-spacing:.14em;text-transform:uppercase;font-weight:700}
header .sub{color:var(--muted);font-size:calc(12px * var(--scale));letter-spacing:.06em}
header .spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 13px;font-size:calc(13px * var(--scale));color:var(--ink2)}
.btn:hover{background:var(--panel)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.btn.primary:hover{background:#000}
main{padding:0 26px 60px}

/* ---------- panels ---------- */
.panel{border:1px solid var(--line);border-radius:10px;margin:18px 0;background:#fff}
.panel > .head{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line2);
  font-size:calc(12px * var(--scale));letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.panel > .head .spacer{flex:1}
.panel > .body{padding:16px}
.hidden{display:none !important}

/* ---------- setup ---------- */
.setup-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px}
.field{margin-bottom:12px}
.field > label{display:block;font-size:calc(11px * var(--scale));letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin-bottom:5px}
.field input[type=text],.field input[type=number]{width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
.namelist{display:flex;flex-direction:column;gap:5px}
.namerow{display:flex;gap:5px;align-items:center}
.namerow .idx{width:26px;color:var(--muted);font-size:calc(12px * var(--scale))}
.namerow input{flex:1;padding:4px 7px;border:1px solid var(--line);border-radius:5px}
.namerow .x{border:none;background:none;color:var(--muted);padding:2px 5px;font-size:15px;line-height:1}
.namerow .x:hover{color:var(--red)}
.radio{display:flex;gap:6px;flex-direction:column}
.radio label{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border:1px solid var(--line);border-radius:7px;cursor:pointer}
.radio label:hover{background:var(--panel)}
.radio label.on{border-color:var(--ink);background:var(--panel)}
.radio .t{font-weight:600;font-size:calc(13px * var(--scale))}
.radio .d{color:var(--muted);font-size:calc(11.5px * var(--scale));margin-top:1px}
.note{color:var(--muted);font-size:calc(12px * var(--scale));margin-top:8px;line-height:1.5}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

/* ---------- input matrix ---------- */
.matrix{border-collapse:collapse;width:100%}
.matrix th,.matrix td{border:1px solid var(--line);padding:0;text-align:center}
.matrix thead th{background:var(--panel);padding:7px 6px;font-size:calc(12px * var(--scale));font-weight:600;color:var(--ink2)}
.matrix thead th.jname{min-width:96px}
.matrix tbody th{background:var(--panel);padding:7px 12px;text-align:left;font-weight:600;font-size:calc(13px * var(--scale));white-space:nowrap}
.matrix input{width:100%;height:100%;min-height:40px;border:none;outline:none;text-align:center;background:transparent;
  font-size:calc(19px * var(--scale));font-weight:600;padding:4px 0}
.matrix input:focus{background:#fffbe8;box-shadow:inset 0 0 0 2px var(--ink)}
.matrix td.sus input{color:var(--amber)}
.matrix td.sus{background:#fffdf5}
.matrix td.bad input{color:var(--red);background:var(--redbg)}
.matrix td{position:relative}
.matrix td .flagdot{position:absolute;top:3px;right:5px;font-size:10px;color:var(--amber);pointer-events:none}

.readback{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.readback h4{margin:0 0 4px;font-size:calc(12px * var(--scale));letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.rbline{display:flex;gap:12px;align-items:baseline;padding:3px 0}
.rbline .n{width:150px;color:var(--ink2);font-size:calc(13px * var(--scale))}
.rbline .v{font-size:calc(20px * var(--scale));font-weight:600;letter-spacing:.16em}
.rbline .v .miss{color:var(--red)}

.stopwatch{font-size:calc(13px * var(--scale));color:var(--muted)}
.stopwatch b{color:var(--ink);font-size:calc(15px * var(--scale))}

/* ---------- board ---------- */
.boardbar{display:flex;align-items:center;gap:14px;margin:22px 0 6px}
.boardbar .agenda{font-size:calc(13px * var(--scale));color:var(--ink2)}
.boardbar .agenda b{color:var(--ink)}
.boardbar .spacer{flex:1}
.demo-banner{background:var(--goldbg);border:1px solid #fcd34d;color:var(--gold);border-radius:7px;
  padding:5px 11px;font-size:calc(12px * var(--scale));font-weight:600;letter-spacing:.03em}

.axis{display:grid;grid-template-columns:var(--labelw) 1fr var(--tailw);align-items:end;margin-bottom:2px}
.axis .ticks{position:relative;height:18px}
.axis .ticks span{position:absolute;transform:translateX(-50%);font-size:calc(11px * var(--scale));color:var(--muted)}
.axis .tailh{display:flex;gap:10px;justify-content:flex-end;align-items:baseline;
  font-size:calc(11px * var(--scale));
  color:var(--muted);letter-spacing:.08em;text-transform:uppercase;padding-bottom:2px}
.axis .tailh .tb{width:58px;text-align:right}
.axis .tailh .tw{width:52px;text-align:right}
.axis .tailh .tgl{width:20px;height:20px;padding:0;line-height:1;border:1px solid var(--line);
  background:#fff;border-radius:5px;color:var(--ink2);font-size:calc(13px * var(--scale))}
.axis .tailh .tgl:hover{background:var(--panel)}

.rows{border-top:1px solid var(--line)}
.trow{display:grid;grid-template-columns:var(--labelw) 1fr var(--tailw);align-items:stretch;
  border-bottom:1px solid var(--line);cursor:pointer}
.trow:hover{background:#fafbfc}
.trow .label{display:flex;align-items:center;gap:9px;padding:10px 14px 10px 4px}
.trow .rank{width:26px;text-align:center;font-weight:700;font-size:calc(15px * var(--scale));color:var(--ink2)}
.trow .medal{width:24px;text-align:center;font-size:calc(20px * var(--scale));line-height:1}
.trow .medal.last{font-size:calc(14px * var(--scale));color:#9aa1a9}
.trow .tname{font-weight:600;font-size:calc(16px * var(--scale));flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .chip{font-size:calc(10.5px * var(--scale));font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  padding:3px 8px;border-radius:99px;white-space:nowrap}
.chip.green{background:var(--greenbg);color:var(--green);border:1px solid var(--greenline)}
.chip.red{background:var(--redbg);color:var(--red);border:1px solid var(--redline)}

.plot{position:relative;margin:6px 0;min-height:46px}
.plot .grid{position:absolute;inset:0}
.plot .grid i{position:absolute;top:0;bottom:0;width:1px;background:var(--line2)}
.plot .gapline{position:absolute;top:2px;bottom:2px;width:0;border-left:2px dashed var(--redline)}
.dot{position:absolute;width:17px;height:17px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:700}
.tail{display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:10px 6px 10px 0}
.tail .primary{width:58px;text-align:right;font-size:calc(21px * var(--scale));font-weight:700}
.tail .xcol{width:52px;text-align:right;font-size:calc(13.5px * var(--scale));color:var(--ink2)}

.brow{display:grid;grid-template-columns:var(--labelw) 1fr var(--tailw);
  border-bottom:1px solid var(--line);cursor:pointer;background:var(--panel)}
.brow:hover{background:#eceff3}
.bh2h{display:flex;align-items:baseline;gap:7px;padding:5px 0;
  font-size:calc(12px * var(--scale));color:var(--muted)}
.bh2h b{color:var(--ink);font-size:calc(15px * var(--scale));font-variant-numeric:tabular-nums;font-weight:700}
.bh2h .sep{color:var(--line)}
.cmpwith{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.cmpwith .btn{padding:4px 10px;font-size:calc(12.5px * var(--scale))}


.legend{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:calc(12px * var(--scale))}
.legend b{color:var(--ink2)}

/* ---------- detail ---------- */
.overlay{position:fixed;inset:0;background:rgba(17,20,24,.45);display:flex;align-items:flex-start;
  justify-content:center;padding:40px 20px;overflow:auto;z-index:50}
.sheet{background:#fff;border-radius:12px;max-width:900px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.sheet .shead{display:flex;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid var(--line)}
.sheet .shead h2{margin:0;font-size:calc(22px * var(--scale))}
.sheet .shead .meta{color:var(--muted);font-size:calc(14px * var(--scale))}
.sheet .sbody{padding:22px 24px 26px}
.sheet .close{margin-left:auto}
.block{margin-bottom:26px}
.block h3{margin:0 0 10px;font-size:calc(11.5px * var(--scale));letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.jtable{width:100%;border-collapse:collapse}
.jtable td,.jtable th{padding:7px 8px;border-bottom:1px solid var(--line2);font-size:calc(14px * var(--scale));vertical-align:middle}
.jtable th{font-size:calc(11px * var(--scale));letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  font-weight:600;text-align:left;border-bottom:1px solid var(--line)}
.jtable .jn{font-weight:600;white-space:nowrap}
.jtable .strip{position:relative;height:22px;min-width:340px;width:40%}
.jtable .strip i{position:absolute;top:0;bottom:0;width:1px;background:var(--line2)}
.jtable .strip .d{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%)}
.jtable .sc{width:44px;text-align:center;font-weight:700;font-size:calc(16px * var(--scale))}
.jtable .adj{width:76px;text-align:right;font-weight:600}
.adj.neg,.adj.pos{color:var(--ink)} .adj.zero{color:var(--muted)}
.comp{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.comp .c{border:1px solid var(--line);border-radius:8px;padding:7px 13px;min-width:66px;text-align:center}
.comp .c .p{font-size:calc(11px * var(--scale));color:var(--muted)}
.comp .c .n{font-size:calc(20px * var(--scale));font-weight:700}
.comp .c.z .n{color:#d5d9de}
.private{border:1px dashed var(--amber);border-radius:8px;padding:12px 14px;background:#fffdf5}
.private h3{color:var(--amber)}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;
  font-family:ui-monospace,Menlo,monospace;font-size:calc(11px * var(--scale));background:var(--panel)}
.selftest{font-size:calc(11.5px * var(--scale));color:var(--muted)}
.selftest.fail{color:var(--red);font-weight:600}
/* Inline comparator */
#comparator{margin-top:48px;padding-top:28px;border-top:2px solid var(--ink)}
#comparator h2{font-size:26px;margin:0 0 6px} .compare-intro{color:var(--ink2);margin:0 0 24px}
.compare-controls{display:grid;grid-template-columns:1fr 1fr auto;gap:20px;align-items:end;max-width:960px}
.compare-controls label{display:grid;gap:8px;font-weight:600;font-size:13px}
.compare-controls select{width:100%;min-width:0;padding:11px 36px 11px 12px;border:1px solid #a5adb7;border-radius:6px;background:#fff}
.compare-controls button{min-height:44px}.compare-controls button:disabled{background:var(--panel);border-color:var(--line);color:#69717c;cursor:not-allowed}
#comparator :focus-visible{outline:2px solid #245bb2;outline-offset:3px}
.compare-status{font-size:13px;color:var(--ink2);margin:12px 0 24px}
.compare-heading{font-size:22px;margin:30px 0 12px;overflow-wrap:anywhere}
.compare-key{display:flex;gap:24px;flex-wrap:wrap;font-weight:600;margin-bottom:24px}
.compare-key span{display:flex;align-items:center;gap:8px;overflow-wrap:anywhere}
.compare-key span:before{content:"";width:12px;height:12px;background:currentColor;flex-shrink:0}
.compare-key .team-a{color:#245bb2}.compare-key .team-b{color:#a34f18}
.compare-columns{display:grid;grid-template-columns:1fr 1fr;gap:48px}
#comparator h4{font-size:16px;margin:24px 0 16px}
.compare-columns h4:first-child{margin-top:0}.compare-table td{text-align:right}.compare-table th{letter-spacing:0;text-transform:none;overflow-wrap:anywhere;color:var(--ink2)}
.compare-table{table-layout:fixed}.compare-table th:first-child{width:43%}
.chart-track{height:12px;background:var(--line2);overflow:hidden;border-radius:2px;flex:1}
.chart-track>div{height:100%}.chart-track .team-a{background:#245bb2}.chart-track .team-b{background:#a34f18}.chart-track .equal{background:#6b7280}
.preference-row{display:grid;grid-template-columns:70px 1fr 24px;align-items:center;gap:12px;margin:14px 0;font-size:13px}
.comparison-bar-row{display:grid;grid-template-columns:minmax(100px,180px) 1fr;gap:20px;padding:12px 0;border-bottom:1px solid var(--line2);align-items:center}
.bar-label{font-size:13px;overflow-wrap:anywhere}.bar-pair{display:grid;gap:6px}.bar-line{display:flex;gap:12px;align-items:center}.bar-line>span{width:44px;font-size:12px}
@media(max-width:700px){main{padding:0 16px 40px}.compare-controls,.compare-columns{grid-template-columns:1fr;gap:18px}.compare-controls button{width:100%}.comparison-bar-row{grid-template-columns:100px 1fr;gap:12px}#board{overflow-x:auto}#board>.boardbar+div{min-width:760px}header{flex-wrap:wrap;padding:14px 16px}header .sub{flex-basis:100%}.matrix{min-width:760px}#inputPanel>.body{overflow:auto}}
/* Editorial report — B */
:root{--ink:#263e32;--ink2:#343c35;--muted:#61665b;--bg:#f3efe6;--panel:#ebe6db;--line:#c9c9b9;--line2:#deddd0;--green:#3d5845;--greenbg:#e5e9dc;--greenline:#abb9a2;--red:#9d412b;--redbg:#f1e2d8;--redline:#c98e78;--amber:#8b4b20;--gold:#705226;--goldbg:#eae2cc}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink2);background:var(--bg);font-size:calc(16px * var(--scale));scrollbar-color:#959d8a var(--bg)}
::selection{background:#d9dec9;color:#263e32}input{caret-color:var(--ink)}a{text-underline-offset:3px}
header{margin:0 3.2%;padding:32px 0 25px;gap:20px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
header h1{font-family:Georgia,'Times New Roman',serif;font-weight:600;font-size:clamp(34px,4.6vw,72px);letter-spacing:-.035em;text-transform:none;line-height:1.05;color:var(--ink)}
header .sub{font-family:Georgia,'Times New Roman',serif;font-size:calc(19px * var(--scale));letter-spacing:0;max-width:270px;border-left:1px solid #929c8e;padding-left:20px;color:var(--ink2)}
main{padding:0 3.2% 50px;max-width:2000px;margin:auto}.mono{font-family:Arial,Helvetica,sans-serif;font-variant-numeric:tabular-nums}
.btn{border-color:#919b8c;border-radius:2px;background:transparent;color:var(--ink);padding:8px 15px}.btn:hover{background:#e4e5d7}.btn.primary{background:#a44830;border-color:#a44830;color:#fff}.btn.primary:hover{background:#863a26}
button:focus-visible,select:focus-visible,.trow:focus-visible{outline:2px solid #a44830;outline-offset:4px}
.panel{background:var(--bg);border-radius:2px}.panel>.head{color:var(--ink);letter-spacing:.04em}.field input[type=text],.field input[type=number],.namerow input{background:#faf8f2;border-color:var(--line);border-radius:2px}
.boardbar{margin:24px 0 24px;gap:20px;flex-wrap:wrap}.board-title{font:500 calc(30px * var(--scale))/1.1 Georgia,serif;margin:0 auto 0 0;color:var(--ink)}
.boardbar>.spacer{display:none}.demo-banner{background:transparent;border:0;border-radius:0;font-size:11px;color:#705226;padding:0;letter-spacing:.04em}.boardbar .agenda{font-size:13px}
.rank-label{font:calc(15px * var(--scale)) Georgia,serif;color:var(--ink);padding-left:12px}.axis{padding-bottom:10px}.axis .ticks span{font-size:calc(14px * var(--scale));color:var(--ink2)}
.axis .tailh{color:var(--ink);letter-spacing:0;text-transform:none;font-family:Georgia,serif;font-size:calc(17px * var(--scale))}.axis .tailh .tb{width:76px}.axis .tailh .tgl{background:transparent;border-color:var(--line);order:3}
.rows{border-top:1px solid #899783}.trow{min-height:76px}.trow:hover{background:#e9e9db}.trow .label{gap:12px;padding:10px 20px 10px 4px}.trow .rank{font:calc(26px * var(--scale)) Georgia,serif;width:32px;color:var(--ink)}
.trow .medal{display:none}.trow .medal.last{display:block;width:12px;font-size:12px;color:var(--muted)}.trow .tname{font:calc(27px * var(--scale)) Georgia,serif;color:var(--ink)}.trow .chip{border:0;background:none;border-radius:0;padding:0;font-size:calc(11px * var(--scale));letter-spacing:0;text-transform:none}
.plot .grid{top:50%;bottom:auto;border-top:1px solid #a2ad9b}.plot .grid i{top:-3px;height:7px;background:#b6bfad}.dot{background:#3c5745;width:18px;height:18px;font-size:9px;color:#fff}
.tail{padding-right:30px;gap:10px}.tail .primary{width:76px;font:calc(28px * var(--scale)) Georgia,serif;color:var(--ink)}.tail .xcol{color:var(--ink2)}
.legend{font-size:calc(12px * var(--scale));gap:5px 20px;line-height:1.65;margin-top:12px}.legend b{color:var(--ink)}
#comparator{margin-top:30px;padding-top:22px;border-top:2px solid var(--ink)}#comparator h2{font:500 calc(32px * var(--scale)) Georgia,serif;color:var(--ink)}.compare-intro{margin:6px 0 20px;font-size:14px;color:var(--muted)}
.compare-controls{max-width:1000px;gap:18px}.compare-controls label{font-size:13px;font-weight:400;color:var(--muted)}.compare-controls select{border-radius:2px;background:transparent;border-color:#919b8c;font:calc(19px * var(--scale)) Georgia,serif;padding:11px 32px 11px 12px}.compare-controls button{font:calc(18px * var(--scale)) Georgia,serif;min-height:47px}
.compare-status{color:var(--muted);font-size:12px;margin:10px 0 18px}.compare-controls button:disabled{background:#e6e3d9;color:#62675e;border-color:#b9beb0}
.compare-heading{font:500 calc(27px * var(--scale)) Georgia,serif;margin:22px 0 10px;color:var(--ink)}.compare-key{font-size:14px;margin-bottom:22px}.compare-key .team-a{color:#3c5745}.compare-key .team-b{color:#a44830}
.compare-columns{grid-template-columns:1fr 1.05fr;gap:30px 48px;align-items:start}.compare-columns>.comparison-charts{grid-column:1;grid-row:2}.judge-comparison{grid-column:2;grid-row:1 / span 2;border-left:1px solid #b7bfad;padding-left:30px}
#comparator h4{font:500 calc(23px * var(--scale)) Georgia,serif;margin:0 0 14px;color:var(--ink)}#comparator .comparison-charts h4:not(:first-child){margin-top:25px}
.jtable td,.jtable th{border-color:var(--line2);padding:9px 8px;font-size:calc(16px * var(--scale))}.compare-table th{font-weight:400}.compare-table thead th{font:calc(16px * var(--scale)) Georgia,serif;color:var(--ink);text-transform:none;letter-spacing:0;border-bottom:1px solid #a3ae97}.compare-table td{color:var(--ink)}
.judge-comparison .jtable th:first-child{width:46%}.judge-comparison .jtable td{font-size:calc(18px * var(--scale))}.chart-track{background:#dddccf;border-radius:0;height:10px}.chart-track .team-a{background:#3c5745}.chart-track .team-b{background:#a44830}.chart-track .equal{background:#858779}.preference-row{font-size:15px;grid-template-columns:80px 1fr 26px}.bar-label{font-size:14px}.bar-line>span{font-size:13px}.note{font-size:12px;color:var(--muted)}
.sheet{background:var(--bg);border-radius:3px}.sheet .shead h2{font-family:Georgia,serif;color:var(--ink)}.sheet .shead{border-color:var(--line)}.comp .c{border-radius:2px}.matrix thead th,.matrix tbody th{background:var(--panel)}

<body>

<header>
  <h1>WellWithAll Prize</h1>
  <span class="sub">Judge Deliberation</span>
  <span class="spacer"></span>
  <span class="stopwatch" id="sw"></span>
  <span class="sync-status" id="syncStatus" role="status" aria-live="polite"></span>
  <button class="btn" id="btnSetup">Setup</button>
  <button class="btn" id="btnInput">Scores</button>
</header>

<main>
  <!-- ============ SETUP ============ -->
  <section class="panel hidden" id="setupPanel">
    <div class="head">Setup <span class="spacer"></span><span class="selftest" id="selftest" hidden></span>
      <button class="btn" id="btnCloseSetup">Close</button></div>
    <div class="body">
      <div class="setup-grid">
        <div>
          <div class="field"><label>Judges</label>
            <div class="namelist" id="judgeList"></div>
            <div class="rowbtns"><button class="btn" id="addJudge">+ Add judge</button></div>
          </div>
        </div>
        <div>
          <div class="field"><label>Finalist teams</label>
            <div class="namelist" id="teamList"></div>
            <div class="rowbtns"><button class="btn" id="addTeam">+ Add team</button></div>
          </div>
        </div>
        <div>
          <div class="field"><label>Last-place mark</label>
            <div class="radio" id="prizeRadio">
              <label data-v="A"><input type="radio" name="prize" value="A">
                <span><span class="t">Option A — 3 winners</span><span class="d">Last place carries the ▼ mark</span></span></label>
              <label data-v="B"><input type="radio" name="prize" value="B">
                <span><span class="t">Option B — all 5 win</span><span class="d">No last-place mark</span></span></label>
            </div>
          </div>
          <div class="field"><label>Flag red when range &ge;</label>
            <input type="number" id="thresh" min="1" max="9" step="1">
            <div class="note" id="threshNote"></div>
          </div>
          <div class="field"><label>Screen size</label>
            <input type="range" id="scale" min="0.85" max="1.5" step="0.05">
          </div>
        </div>
        <div>
          <div class="field"><label>Data</label>
            <div class="rowbtns">
              <button class="btn" id="clearAll">Clear all scores</button>
              <button class="btn" id="copyData">Copy scores as text</button>
            </div>
            <div class="note">Saved online and shared with everyone who opens this link. Anyone with the link can enter scores.</div>
          </div>
          <div class="field private">
            <h3>Alternative ranking</h3>
            <label style="display:flex;gap:8px;align-items:center;font-size:calc(13px * var(--scale));text-transform:none;letter-spacing:0;color:var(--ink2)">
              <input type="checkbox" id="showMean"> Show the mean-score ranking
            </label>
            <div class="note">Main board: Borda ranking.</div>
            <div id="meanBox" class="hidden" style="margin-top:10px"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ INPUT ============ -->
  <section class="panel hidden" id="inputPanel">
    <div class="head">Enter scores
      <span class="spacer"></span>
      <button class="btn" id="btnDone">Show board</button>
    </div>
    <div class="body">
      <table class="matrix" id="matrix"></table>
      <div class="readback">
        <h4>Review scores</h4>
        <div id="readback"></div>
      </div>
      <div class="note">Enter scores from 1 to 10. Use Tab or Enter to move between cells.</div>
    </div>
  </section>

  <!-- ============ BOARD ============ -->
  <section id="board"></section>
</main>

<div id="overlayHost"></div>

<script>
"use strict";

/* =========================================================================
   TALLY — the whole decision layer behind one function.
   Input : {teams, judges, scores, redThreshold}
   Output: everything the screen needs. No DOM, no globals, no side effects.
   ========================================================================= */
const Tally = (function () {

  const mean = a => a.reduce((s, x) => s + x, 0) / a.length;
  const round1 = x => Math.round(x * 10) / 10;

  function computeTally(input) {
    const teams = input.teams, judges = input.judges, scores = input.scores;
    const T = teams.length, J = judges.length;
    const thr = input.redThreshold;

    const get = (t, j) => {
      const row = scores[t.id];
      const v = row ? row[j.id] : null;
      return (typeof v === "number" && v >= 1 && v <= 10) ? v : null;
    };

    const filled = [];
    let complete = true;
    teams.forEach(t => judges.forEach(j => {
      const v = get(t, j);
      if (v === null) complete = false; else filled.push(v);
    }));
    if (!complete || T < 2 || J < 1) {
      return { complete: false, teams: [], judges: [], totalCells: T * J, filled: filled.length };
    }

    const panelTotal = {}, teamScores = {};
    teams.forEach(t => {
      teamScores[t.id] = judges.map(j => get(t, j));
      panelTotal[t.id] = teamScores[t.id].reduce((s, x) => s + x, 0);
    });

    const judgeMean = {};
    judges.forEach(j => { judgeMean[j.id] = mean(teams.map(t => get(t, j))); });

    /* --- Borda. Within one judge, equal scores are separated by the panel's own raw
       total for those teams (the team the whole panel rated higher goes ahead).
       If the panel totals are equal too, nothing separates them on merit, so they
       split the points of the places they occupy. Presentation (list) order never
       decides anything. --- */
    const borda = {}, sharedBorda = {}, placeCount = {}, tieBreaks = [], tieDecided = {};
    teams.forEach(t => {
      borda[t.id] = 0; sharedBorda[t.id] = 0; tieDecided[t.id] = 0;
      placeCount[t.id] = new Array(T).fill(0);
    });

    judges.forEach(j => {
      const order = teams.map((t, i) => ({ t, i, s: get(t, j) }));
      order.sort((a, b) =>
        (b.s - a.s) || (panelTotal[b.t.id] - panelTotal[a.t.id]) || (a.i - b.i));
      order.forEach((o, idx) => { placeCount[o.t.id][idx] += 1; });
      for (let a = 0; a < T; ) {
        let b = a;
        while (b + 1 < T && order[b + 1].s === order[a].s &&
               panelTotal[order[b + 1].t.id] === panelTotal[order[a].t.id]) b++;
        let pts = 0;
        for (let p = a; p <= b; p++) pts += T - p;
        for (let p = a; p <= b; p++) borda[order[p].t.id] += pts / (b - a + 1);
        a = b + 1;
      }
      for (let k = 0; k < order.length - 1; k++) {
        if (order[k].s === order[k + 1].s) {
          tieBreaks.push({ judge: j, ahead: order[k].t, behind: order[k + 1].t, score: order[k].s, reason: panelTotal[order[k].t.id] === panelTotal[order[k + 1].t.id] ? "shared" : "panel-total", aheadTotal: panelTotal[order[k].t.id], behindTotal: panelTotal[order[k + 1].t.id] });
        }
      }
      /* Same ordering, but teams this judge scored equally split the points of the
         positions they occupy instead of being separated. The gap between this and
         the strict total is the part of the ranking the tie-break rule produced. */
      let a = 0;
      while (a < T) {
        let b = a;
        while (b + 1 < T && order[b + 1].s === order[a].s) b++;
        let pts = 0;
        for (let p = a; p <= b; p++) pts += T - p;
        const each = pts / (b - a + 1);
        for (let p = a; p <= b; p++) {
          sharedBorda[order[p].t.id] += each;
          if (b > a) tieDecided[order[p].t.id] += 1;
        }
        a = b + 1;
      }
    });

    /* Head to head on the raw scores. Ties are counted, never broken. */
    const h2h = {};
    teams.forEach(a => {
      h2h[a.id] = {};
      teams.forEach(b => {
        if (a.id === b.id) return;
        const higher = [], tied = [], lower = [];
        judges.forEach(j => {
          const d = get(a, j) - get(b, j);
          (d > 0 ? higher : d < 0 ? lower : tied).push(j);
        });
        h2h[a.id][b.id] = { higher: higher, tied: tied, lower: lower };
      });
    });

    const rows = teams.map((t, i) => {
      const raw = teamScores[t.id];
      const sorted = raw.slice().sort((a, b) => a - b);
      const range = sorted[J - 1] - sorted[0];

      let largestGap = 0, cutAt = -1;
      for (let k = 0; k < J - 1; k++) {
        const g = sorted[k + 1] - sorted[k];
        if (g > largestGap) { largestGap = g; cutAt = k; }
      }
      const lowCount = cutAt + 1, highCount = J - lowCount;

      let shape;
      if (range < thr) shape = "consensus";
      else if (largestGap >= 2 && Math.min(lowCount, highCount) === 1) shape = "lone";
      else if (largestGap >= 2) shape = "camps";
      else shape = "spread";

      const calibration = judges.map((j, jj) => ({
        judge: j, score: raw[jj], delta: round1(raw[jj] - judgeMean[j.id])
      })).sort((a, b) => a.delta - b.delta || a.score - b.score);

      return {
        team: t, index: i, scores: raw, sorted: sorted,
        borda: borda[t.id], panelTotal: panelTotal[t.id], mean: round1(mean(raw)),
        range: range, largestGap: largestGap, cutValue: cutAt >= 0 ? (sorted[cutAt] + sorted[cutAt + 1]) / 2 : null,
        lowCount: lowCount, highCount: highCount,
        flag: range >= thr ? "red" : "green", shape: shape,
        placeCount: placeCount[t.id],
        sharedBorda: round1(sharedBorda[t.id]), tieDecided: tieDecided[t.id],
        calibration: calibration
      };
    });

    /* Teams level on both Borda points and panel total share a place (shown "T2").
       Within a tie they are listed alphabetically, which carries no meaning. */
    rows.sort((a, b) => (b.borda - a.borda) || (b.panelTotal - a.panelTotal) ||
                        a.team.name.localeCompare(b.team.name));
    rows.forEach(r => {
      r.rank = 1 + rows.filter(o => o.borda > r.borda || (o.borda === r.borda && o.panelTotal > r.panelTotal)).length;
    });
    rows.forEach(r => { r.tied = rows.some(o => o !== r && o.rank === r.rank); });

    const byMean = rows.slice().sort((a, b) => (b.mean - a.mean) || (b.panelTotal - a.panelTotal));
    const meanDisagrees = byMean.some((r, i) => r.rank !== i + 1);

    return {
      complete: true, teams: rows, judges: judges, judgeMean: judgeMean,
      redCount: rows.filter(r => r.flag === "red").length,
      tieBreaks: tieBreaks, byMean: byMean, meanDisagrees: meanDisagrees, h2h: h2h,
      bordaCheck: rows.reduce((s, r) => s + r.borda, 0) === J * T * (T + 1) / 2,
      sharedCheck: Math.abs(rows.reduce((s, r) => s + r.sharedBorda, 0) - J * T * (T + 1) / 2) < 0.05
    };
  }

  return { computeTally: computeTally };
})();

/* =========================================================================
   SELF-TESTS — the two patterns the design doc says must look different.
   ========================================================================= */
function runSelfTests() {
  const out = [];
  const mk = (rowsOfScores, thr) => {
    const J = rowsOfScores[0].length;
    const judges = Array.from({ length: J }, (_, i) => ({ id: "j" + i, name: "J" + (i + 1) }));
    const teams = rowsOfScores.map((_, i) => ({ id: "t" + i, name: "T" + (i + 1) }));
    const scores = {};
    teams.forEach((t, ti) => { scores[t.id] = {}; judges.forEach((j, ji) => scores[t.id][j.id] = rowsOfScores[ti][ji]); });
    return Tally.computeTally({ teams, judges, scores, redThreshold: thr });
  };
  const ok = (name, cond) => out.push({ name, pass: !!cond });

  const r = mk([[8,8,8,8,8,3],[9,9,9,4,4,4],[7,7,8,8,7,8],[5,5,6,5,6,6],[2,3,2,3,2,3]], 3);
  const t0 = r.teams.find(x => x.team.id === "t0");
  const t1 = r.teams.find(x => x.team.id === "t1");
  ok("8 8 8 8 8 3 reads as a lone dissent", t0.shape === "lone" && t0.flag === "red");
  ok("9 9 9 4 4 4 reads as two camps", t1.shape === "camps" && t1.lowCount === 3 && t1.highCount === 3);
  ok("consensus rows stay green", r.teams.filter(x => x.flag === "green").length === 3);
  ok("Borda points sum to n x T(T+1)/2", r.bordaCheck);
  ok("no shared places: every judge hands out each place once",
     r.teams.reduce((s, x) => s + x.placeCount.reduce((a, b) => a + b, 0), 0) === 6 * 5);
  const inc = mk([[8,8,8,8,8,null],[9,9,9,4,4,4],[7,7,8,8,7,8],[5,5,6,5,6,6],[2,3,2,3,2,3]], 3);
  ok("an unfinished matrix reports incomplete", inc.complete === false);

  ok("shared-points totals also sum to n x T(T+1)/2", r.sharedCheck);
  const a0 = r.teams[0], a1 = r.teams[1];
  const hh = r.h2h[a0.team.id][a1.team.id];
  ok("head-to-head accounts for every judge exactly once",
     hh.higher.length + hh.tied.length + hh.lower.length === 6);
  ok("head-to-head is symmetric",
     r.h2h[a1.team.id][a0.team.id].higher.length === hh.lower.length);
  /* When no judge separates anything, the strict ranking is pure tie-break and the
     shared-points totals must collapse onto a single value. */
  const flat = mk([[7,7,7,7,7,7],[7,7,7,7,7,7],[7,7,7,7,7,7],[7,7,7,7,7,7],[7,7,7,7,7,7]], 3);
  ok("a panel that separated nothing gives every team the same shared total",
     new Set(flat.teams.map(x => x.sharedBorda)).size === 1);
  ok("a panel that separated nothing ties every team at rank 1",
     flat.teams.every(x => x.rank === 1 && x.tied) && flat.bordaCheck);
  ok("equal panel totals split points instead of using list order", flat.tieBreaks.length > 0 && flat.tieBreaks.every(t => t.reason === "shared" && t.aheadTotal === t.behindTotal));
  /* Swapping two identical teams in the list must not change who is ahead. */
  const sw1 = mk([[8,6],[6,8],[5,5]], 3), sw2 = mk([[6,8],[8,6],[5,5]], 3);
  ok("list order never decides a place",
     sw1.teams.filter(x => x.rank === 1).length === 2 && sw2.teams.filter(x => x.rank === 1).length === 2);
  ok("a clear winner is not marked tied", r.teams[0].rank === 1 && !r.teams[0].tied);
  const unequal = mk([[8,9],[8,7]], 3);
  ok("unequal panel totals disclose higher-total tie-break", unequal.tieBreaks.length === 1 && unequal.tieBreaks[0].reason === "panel-total" && unequal.tieBreaks[0].aheadTotal === 17 && unequal.tieBreaks[0].behindTotal === 15);
  return out;
}

/* =========================================================================
   STATE
   ========================================================================= */

const JUDGE_PHOTOS = [
  {name:"teresa williamson",x:44,y:31,size:100},
  {name:"karim lakhani",x:445,y:34,size:96},
  {name:"allison scott",x:856,y:19,size:108},
  {name:"rob huckman",x:29,y:228,size:105},
  {name:"andrea baccarelli",x:459,y:218,size:79},
  {name:"craig albert",x:878,y:216,size:87}
];
function applyJudgePortrait(node, name) {
  const normalized = name.toLowerCase().replace(/[^a-z]+/g," ").trim();
  const photo = JUDGE_PHOTOS.find(p => normalized.includes(p.name));
  if (!photo) return;
  const ratio = 68.4 / photo.size;
  node.textContent = ""; node.classList.add("judge-photo");
  node.style.backgroundImage = 'url("' + JUDGE_PHOTO_SOURCE + '")';
  node.style.backgroundSize = (1242 * ratio) + "px " + (386 * ratio) + "px";
  node.style.backgroundPosition = (-photo.x * ratio) + "px " + (-photo.y * ratio) + "px";
  node.setAttribute("role", "img"); node.setAttribute("aria-label", name);
}

function teamLogo(name) {
  const normalized = String(name || "").toLowerCase().replace(/[^a-z]+/g, " ").trim();
  const squashed = normalized.replace(/ /g, "");
  return TEAM_LOGOS.find(l => l.match.some(m => normalized.includes(m) || squashed.includes(m.replace(/ /g, "")))) || null;
}
function teamIdentity(name) {
  const wrap = el("span", "team-id", "");
  const logo = teamLogo(name);
  if (logo) {
    const img = document.createElement("img");
    img.src = logo.src; img.alt = name + " logo"; img.decoding = "async";
    wrap.appendChild(img);
  }
  wrap.appendChild(el("span", "team-id-name", name));
  return wrap;
}

// Presentation order confirmed by Jossy Lee, 2026-09-25.
const FINALISTS = ["MEandMine", "Slingshot AI", "MedHaul", "Boston Children's Hospital", "Xandar Kardian"];
// Alphabetical by first name, left to right; the position is the judge's card number.
const DEFAULT_JUDGES = ["Allison Scott", "Andrea Baccarelli", "Craig Albert",
                        "Karim Lakhani", "Rob Huckman", "Teresa Williamson"];
const DEFAULT_TEAMS = FINALISTS.slice();

let state = loadState() || freshState();

function freshState() {
  const s = {
    judges: DEFAULT_JUDGES.map((n, i) => ({ id: "j" + i, name: n })),
    teams: DEFAULT_TEAMS.map((n, i) => ({ id: "t" + i, name: n })),
    scores: {}, prize: "A", threshold: 3, scale: 1, showMean: false, demo: false,
    expandBorda: false, phase: "input"
  };
  s.teams.forEach(t => { s.scores[t.id] = {}; s.judges.forEach(j => s.scores[t.id][j.id] = null); });
  return s;
}
function loadState() { try { const r = localStorage.getItem(STORE_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  if (typeof Sync !== "undefined") Sync.onLocalChange();
}

function normalise() {
  // Sample (demo) boards are retired: a browser still holding one starts on a blank board.
  if (state.demo) { state = freshState(); }
  // A board with no scores that still lists exactly the default teams and judges, only in an
  // older order, adopts the current order. Renamed or added names are never touched.
  const anyScore = state.teams.some(t => state.judges.some(j => typeof state.scores[t.id]?.[j.id] === "number"));
  const sameSet = (list, want) => list.length === want.length && want.every(n => list.includes(n));
  const reorderedOnly = (list, want) => sameSet(list, want) && list.some((n, i) => n !== want[i]);
  const teamNames = state.teams.map(t => t.name === "Ash by Slingshot AI" ? "Slingshot AI" : t.name), judgeNames = state.judges.map(j => j.name);
  if (!anyScore && sameSet(teamNames, FINALISTS) && sameSet(judgeNames, DEFAULT_JUDGES) &&
      (reorderedOnly(teamNames, FINALISTS) || reorderedOnly(judgeNames, DEFAULT_JUDGES))) {
    const keep = { prize: state.prize, threshold: state.threshold, scale: state.scale, showMean: state.showMean };
    state = Object.assign(freshState(), keep);
  }
  // Earlier name for Slingshot AI's entry.
  state.teams.forEach(t => { if (t.name === "Ash by Slingshot AI") t.name = "Slingshot AI"; });
  // Replace former placeholder team names by position; typed names are left alone.
  const placeholderTeams = ["Team Alpha", "Team Beta", "Team Gamma", "Team Delta", "Team Echo"];
  state.teams.forEach((t, i) => {
    if ((t.name === placeholderTeams[i] || t.name === "Finalist " + (i + 1)) && FINALISTS[i]) t.name = FINALISTS[i];
  });

  // Correct the former placeholder name while preserving the judge ID and scores.
  state.judges.forEach(j => { if (/\bwalensky\b/i.test(j.name)) j.name = "Craig Albert"; });
  state.teams.forEach(t => {
    if (!state.scores[t.id]) state.scores[t.id] = {};
    state.judges.forEach(j => { if (!(j.id in state.scores[t.id])) state.scores[t.id][j.id] = null; });
  });
}
function newId(pref, list) { let n = 0; while (list.some(x => x.id === pref + n)) n++; return pref + n; }

/* =========================================================================
   RENDER
   ========================================================================= */
const $ = s => document.querySelector(s);

function render() {
  normalise();
  document.documentElement.style.setProperty("--scale", state.scale);
  saveState();
  const result = Tally.computeTally({
    teams: state.teams, judges: state.judges, scores: state.scores, redThreshold: state.threshold
  });
  renderSetup(result);
  renderMatrix();
  renderBoard(result);
  if (Sync) Sync.applyRole();
}

/* ---------- setup ---------- */
function renderSetup(result) {
  const jl = $("#judgeList");
  jl.innerHTML = "";
  state.judges.forEach((j, i) => {
    const row = document.createElement("div"); row.className = "namerow";
    row.innerHTML = '<span class="idx">J' + (i + 1) + '</span>';
    const inp = document.createElement("input"); inp.type = "text"; inp.value = j.name;
    inp.oninput = () => { j.name = inp.value; saveState(); renderMatrix(); };
    const x = document.createElement("button"); x.className = "x"; x.textContent = "×"; x.title = "Remove";
    x.onclick = () => { if (state.judges.length <= 1) return;
      state.judges = state.judges.filter(y => y !== j);
      state.teams.forEach(t => delete state.scores[t.id][j.id]); render(); };
    row.appendChild(inp); row.appendChild(x); jl.appendChild(row);
  });

  const tl = $("#teamList");
  tl.innerHTML = "";
  state.teams.forEach((t, i) => {
    const row = document.createElement("div"); row.className = "namerow";
    row.innerHTML = '<span class="idx">' + (i + 1) + '</span>';
    const inp = document.createElement("input"); inp.type = "text"; inp.value = t.name;
    inp.oninput = () => { t.name = inp.value; saveState(); renderMatrix(); renderBoard(
      Tally.computeTally({teams:state.teams,judges:state.judges,scores:state.scores,redThreshold:state.threshold})); };
    const x = document.createElement("button"); x.className = "x"; x.textContent = "×"; x.title = "Remove";
    x.onclick = () => { if (state.teams.length <= 2) return;
      state.teams = state.teams.filter(y => y !== t); delete state.scores[t.id]; render(); };
    row.appendChild(inp); row.appendChild(x); tl.appendChild(row);
  });

  document.querySelectorAll('#prizeRadio label').forEach(l => {
    const on = l.dataset.v === state.prize;
    l.classList.toggle("on", on);
    l.querySelector("input").checked = on;
  });
  $("#thresh").value = state.threshold;
  $("#scale").value = state.scale;
  $("#showMean").checked = state.showMean;

  $("#threshNote").textContent = result.complete
    ? (result.redCount + " of " + state.teams.length + " rows flag red at range \u2265 " + state.threshold + ".")
    : "";

  const mb = $("#meanBox");
  mb.classList.toggle("hidden", !state.showMean);
  if (state.showMean && result.complete) {
    mb.innerHTML = '<div style="font-size:calc(12px * var(--scale))">' +
      result.byMean.map((r, i) => '<div style="display:flex;gap:10px;padding:2px 0"><b style="width:18px">' + (i + 1) +
        '</b><span style="flex:1">' + esc(r.team.name) + '</span><span class="mono">' + r.mean.toFixed(1) +
        '</span><span style="width:70px;text-align:right;color:var(--muted)">Borda ' + r.rank + '</span></div>').join("") +
      '</div>';
  } else if (state.showMean) {
    mb.innerHTML = '<div class="note">Not enough scores yet.</div>';
  }
}

/* ---------- input matrix ---------- */
let swStart = null, swTimer = null, swStopped = null;

function renderMatrix() {
  const tbl = $("#matrix");
  tbl.innerHTML = "";
  const thead = document.createElement("thead");
  const hr = document.createElement("tr");
  hr.appendChild(el("th", "", ""));
  state.judges.forEach((j, i) => {
    const th = el("th", "jname", "");
    th.innerHTML = '<div>' + esc(j.name || ("J" + (i + 1))) + '</div>' +
      '<div style="color:var(--muted);font-weight:400;font-size:calc(10.5px * var(--scale))">card ' + (i + 1) + '</div>';
    hr.appendChild(th);
  });
  thead.appendChild(hr); tbl.appendChild(thead);

  const tb = document.createElement("tbody");
  state.teams.forEach((t, ti) => {
    const tr = document.createElement("tr");
    const rowHead = el("th", "", "");
    rowHead.appendChild(teamIdentity(t.name));
    tr.appendChild(rowHead);
    state.judges.forEach((j, ji) => {
      const td = document.createElement("td");
      const inp = document.createElement("input");
      inp.type = "text"; inp.inputMode = "numeric"; inp.maxLength = 2;
      inp.dataset.t = ti; inp.dataset.j = ji;
      const v = state.scores[t.id][j.id];
      inp.value = (v === null || v === undefined) ? "" : String(v);
      inp.addEventListener("input", onCellInput);
      inp.addEventListener("keydown", onCellKey);
      inp.addEventListener("focus", () => inp.select());
      td.appendChild(inp); tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);
  markSuspicious();
  renderReadback();
}

function cellAt(ti, ji) { return document.querySelector('#matrix input[data-t="' + ti + '"][data-j="' + ji + '"]'); }

function advance(ti, ji) {
  let nt = ti + 1, nj = ji;
  if (nt >= state.teams.length) { nt = 0; nj = ji + 1; }
  if (nj >= state.judges.length) return;
  const c = cellAt(nt, nj); if (c) { c.focus(); c.select(); }
}

function startStopwatch() {
  if (swStart) return;
  swStart = Date.now(); swStopped = null;
  swTimer = setInterval(tickStopwatch, 200); tickStopwatch();
}
function tickStopwatch() {
  const ms = (swStopped || Date.now()) - swStart;
  const s = Math.floor(ms / 1000);
  $("#sw").innerHTML = '<b>' + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") + '</b> ' +
    (swStopped ? "to enter + read back" : "entering…") + (s > 90 && !swStopped ? ' · past 90s' : '');
}
function stopStopwatch() { if (swStart && !swStopped) { swStopped = Date.now(); clearInterval(swTimer); tickStopwatch(); } }

function setScore(ti, ji, val) {
  startStopwatch();
  state.scores[state.teams[ti].id][state.judges[ji].id] = val;
  saveState(); markSuspicious(); renderReadback();
}

function onCellInput(e) {
  const inp = e.target, ti = +inp.dataset.t, ji = +inp.dataset.j;
  let v = inp.value.replace(/[^0-9]/g, "");
  if (v === "") { inp.value = ""; setScore(ti, ji, null); return; }
  if (v.length > 2) v = v.slice(0, 2);
  const n = parseInt(v, 10);
  if (n > 10) {                       // "1" then another digit: commit the 1, carry the digit on
    inp.value = v[0]; setScore(ti, ji, parseInt(v[0], 10));
    let nt = ti + 1, nj = ji;
    if (nt >= state.teams.length) { nt = 0; nj = ji + 1; }
    const nx = (nj < state.judges.length) ? cellAt(nt, nj) : null;
    if (nx) { nx.focus(); nx.value = v[1]; nx.dispatchEvent(new Event("input")); }
    return;
  }
  inp.value = v;
  if (n === 0) { setScore(ti, ji, null); return; }   // invalid, wait
  setScore(ti, ji, n);
  if (v === "1") return;              // could still become 10
  advance(ti, ji);
}

function onCellKey(e) {
  const ti = +e.target.dataset.t, ji = +e.target.dataset.j;
  const go = (t, j) => { const c = cellAt(t, j); if (c) { e.preventDefault(); c.focus(); c.select(); } };
  if (e.key === "Enter") go(ti + 1 >= state.teams.length ? 0 : ti + 1, ti + 1 >= state.teams.length ? ji + 1 : ji);
  else if (e.key === "ArrowDown") go(ti + 1, ji);
  else if (e.key === "ArrowUp") go(ti - 1, ji);
  else if (e.key === "ArrowRight") go(ti, ji + 1);
  else if (e.key === "ArrowLeft") go(ti, ji - 1);
}

/* Faint hint only. Never blocks: the extreme score is the signal we came for. */
function markSuspicious() {
  state.teams.forEach((t, ti) => {
    const vals = state.judges.map(j => state.scores[t.id][j.id]).filter(v => typeof v === "number");
    state.judges.forEach((j, ji) => {
      const inp = cellAt(ti, ji); if (!inp) return;
      const td = inp.parentElement;
      const v = state.scores[t.id][j.id];
      td.classList.remove("sus");
      const old = td.querySelector(".flagdot"); if (old) old.remove();
      if (typeof v !== "number" || vals.length < 4) return;
      const others = vals.filter((_, k) => k !== ji).sort((a, b) => a - b);
      const med = others[Math.floor(others.length / 2)];
      const othersRange = others[others.length - 1] - others[0];
      // Only a lone extreme against an otherwise tight row looks like a typo.
      // A genuine 3-against-3 split is not a typo and must not paint the row amber.
      if (othersRange <= 3 && Math.abs(v - med) >= 4) {
        td.classList.add("sus");
        const d = document.createElement("span"); d.className = "flagdot"; d.textContent = "?";
        td.appendChild(d);
      }
    });
  });
}

function renderReadback() {
  const host = $("#readback"); host.innerHTML = "";
  state.judges.forEach((j, ji) => {
    const line = document.createElement("div"); line.className = "rbline";
    const n = el("div", "n", j.name || ("J" + (ji + 1)));
    const v = el("div", "v mono", "");
    v.innerHTML = state.teams.map(t => {
      const s = state.scores[t.id][j.id];
      return (typeof s === "number") ? String(s) : '<span class="miss">_</span>';
    }).join(" ");
    line.appendChild(n); line.appendChild(v); host.appendChild(line);
  });
}

/* ---------- board ---------- */
function renderBoard(result) {
  const host = $("#board");
  host.innerHTML = "";

  const bar = el("div", "boardbar", "");
  bar.appendChild(el("h2", "board-title", "Team rankings"));
  bar.appendChild(el("span", "spacer", ""));
  host.appendChild(bar);

  if (!result.complete) {
    const p = el("div", "panel", "");
    p.innerHTML = '<div class="body" style="color:var(--muted)">' +
      result.filled + " of " + result.totalCells + " scores entered. The board appears when the matrix is full." +
      '</div>';
    host.appendChild(p);
    return;
  }

  const labelw = "380px", tailw = "0px";
  const wrap = el("div", "ranking-wrap", "");
  wrap.style.setProperty("--labelw", labelw);
  wrap.style.setProperty("--tailw", tailw);

  // axis
  const axis = el("div", "axis", "");
  axis.appendChild(el("div", "rank-label", "Rank / Team"));
  const ticks = el("div", "ticks", "");
  for (let s = 1; s <= 10; s++) {
    const sp = el("span", "", String(s));
    sp.style.left = pct(s) + "%";
    ticks.appendChild(sp);
  }
  axis.appendChild(ticks);
  const th = el("div", "tailh", "");

  axis.appendChild(th);
  wrap.appendChild(axis);

  const rows = el("div", "rows", "");
  result.teams.forEach((r, ri) => {
    const row = el("div", "trow", "");
    row.onclick = () => openDetail(r, result);

    const lab = el("div", "label", "");
    lab.appendChild(el("span", "rank", (r.tied ? "T" : "") + r.rank));
    if (r.tied) lab.lastChild.title = "Tied: same Borda points and same panel total";
    const tname = el("span", "tname", "");
    tname.appendChild(teamIdentity(r.team.name));
    lab.appendChild(tname);
    const total = el("span", "team-total", "");
    total.append(el("span", "total-caption", "Total"), el("strong", "", String(r.panelTotal)));
    lab.appendChild(total);
    row.appendChild(lab);

    const plot = el("div", "plot", "");
    const grid = el("div", "grid", "");
    for (let s = 1; s <= 10; s++) { const i = document.createElement("i"); i.style.left = pct(s) + "%"; grid.appendChild(i); const label = el("span", "score-tick", String(s)); label.style.left = pct(s) + "%"; if (!r.scores.includes(s)) grid.appendChild(label); }
    plot.appendChild(grid);
    {
      const average = r.panelTotal / result.judges.length;
      const gl = el("div", "gapline", "");
      gl.style.left = pct(average) + "%";
      gl.title = "Mean score: " + average.toFixed(2) + " (" + result.judges.length + " judges)";
      gl.appendChild(el("span", "mean-label", "Avg " + average.toFixed(1)));
      plot.appendChild(gl);
    }
    const byScore = {};
    r.scores.forEach((s, ji) => { (byScore[s] = byScore[s] || []).push(ji); });
    let maxStack = 1;
    Object.keys(byScore).forEach(k => { maxStack = Math.max(maxStack, byScore[k].length); });
    plot.style.height = Math.max(90, maxStack * 86 + 16) + "px";
    Object.keys(byScore).forEach(k => {
      const list = byScore[k], s = +k;
      list.forEach((ji, idx) => {
        const d = el("div", "dot", "J" + (ji + 1));
        d.style.left = pct(s) + "%";
        d.style.top = "calc(50% + " + ((idx - (list.length - 1) / 2) * 86) + "px)";
        applyJudgePortrait(d, state.judges[ji].name);
        if (list.length % 2 === 1 && idx === Math.floor(list.length / 2))
          d.appendChild(el("span", "portrait-score", String(s)));
        d.title = state.judges[ji].name + " — " + s;
        d.setAttribute("aria-label", d.title);
        plot.appendChild(d);
      });
      if (list.length % 2 === 0) {
        const badge = el("span", "portrait-score", String(s));
        badge.style.left = pct(s) + "%";
        badge.style.top = "50%";
        badge.style.bottom = "auto";
        badge.style.transform = "translate(-50%, -50%)";
        plot.appendChild(badge);
      }
    });
    row.appendChild(plot);

    const tail = el("div", "tail", "");

    row.appendChild(tail);

    rows.appendChild(row);

  });
  wrap.appendChild(rows);

  const lg = el("div", "legend", "");
  lg.innerHTML =
    '<span><b>Total</b> sum of the judges’ 1\u201310 scores</span>' +
    '<span><b>Red dashed line</b> mean score across all judges</span>' +
    '<span><b>J1–J6</b> hover for the judge · click a row for named scores</span>';
  wrap.appendChild(lg);

  if (!result.bordaCheck) {
    wrap.appendChild(el("div", "legend", "⚠ Borda totals failed their own arithmetic check — do not trust this screen."));
  }
  host.appendChild(wrap);

}

/* ---------- detail ---------- */
function openDetail(r, result) {
  const host = $("#overlayHost");
  const ov = el("div", "overlay", "");
  ov.onclick = e => { if (e.target === ov) host.innerHTML = ""; };

  const sheet = el("div", "sheet", "");
  const head = el("div", "shead", "");
  head.innerHTML = '<h2></h2>' +
    '<span class="meta">Total ' + r.panelTotal + ' · Rank ' + (r.tied ? 'tied ' : '') + r.rank + ' of ' + result.teams.length + '</span>' +
    '<span class="chip ' + (r.flag === "red" ? "red" : "green") + '">range ' + r.range + '</span>';
  head.querySelector("h2").appendChild(teamIdentity(r.team.name));
  const cl = el("button", "btn close", "Close"); cl.onclick = () => host.innerHTML = "";
  head.appendChild(cl);
  sheet.appendChild(head);

  const body = el("div", "sbody", "");

  // block 1+2: named scores with the scale adjustment
  const b1 = el("div", "block", "");
  b1.innerHTML = '<h3>Scores by judge</h3>';
  const tbl = el("table", "jtable", "");
  tbl.innerHTML = '<thead><tr><th>Judge</th>' +
    '<th style="position:relative">' +
      '<span style="position:absolute;left:4%;transform:translateX(-50%)">1</span>' +
      '<span style="position:absolute;left:96%;transform:translateX(-50%)">10</span></th>' +
    '<th style="text-align:center">Score</th>' +
    '<th style="text-align:right">vs own avg</th></tr></thead>';
  const tb = document.createElement("tbody");
  r.calibration.forEach(c => {
    const tr = document.createElement("tr");
    tr.appendChild(el("td", "jn", c.judge.name));
    const strip = el("td", "strip", "");
    for (let s = 1; s <= 10; s++) { const t = document.createElement("i"); t.style.left = pct(s) + "%"; strip.appendChild(t); }
    const d = document.createElement("div"); d.className = "d"; d.style.left = pct(c.score) + "%"; strip.appendChild(d);
    tr.appendChild(strip);
    tr.appendChild(el("td", "sc", String(c.score)));
    const sign = c.delta > 0 ? "+" : "";
    tr.appendChild(el("td", "adj mono " + (c.delta < -0.4 ? "neg" : c.delta > 0.4 ? "pos" : "zero"),
      sign + c.delta.toFixed(1)));
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);
  b1.appendChild(tbl);
  b1.appendChild(el("div", "note",
    "vs own avg = this score minus that judge’s own average across all " + result.teams.length + " teams."));
  body.appendChild(b1);

  // block 3: rank composition
  const b2 = el("div", "block", "");
  b2.innerHTML = '<h3>Placements</h3>';
  const comp = el("div", "comp", "");
  r.placeCount.forEach((n, i) => {
    const c = el("div", "c" + (n === 0 ? " z" : ""), "");
    c.innerHTML = '<div class="p">place ' + (i + 1) + '</div><div class="n">' + n + '</div>';
    comp.appendChild(c);
  });
  b2.appendChild(comp);
  b2.appendChild(el("div", "note",
    "How many judges placed this team in each position. Each 1st place scores " + result.teams.length +
    " points down to 1 point for last; Borda " + r.borda + " is their sum."));
  body.appendChild(b2);

  // tie-breaks touching this team
  const tbs = result.tieBreaks.filter(t => t.ahead.id === r.team.id || t.behind.id === r.team.id);
  if (tbs.length) {
    const b3 = el("div", "block", "");
    b3.innerHTML = '<h3>Ties that had to be broken</h3>';
    b3.appendChild(el("div", "note",
      tbs.map(t => t.judge.name + " scored " + t.ahead.name + " and " + t.behind.name + " both " + t.score +
        " — " + t.ahead.name + (t.reason === "panel-total" ? " was placed ahead by the higher panel total (" + t.aheadTotal + " vs " + t.behindTotal + ")." : " and " + t.behind.name + " split the points for those places, because their panel totals are also equal (" + t.aheadTotal + ").")).join(" ")));
    body.appendChild(b3);
  }


  sheet.appendChild(body);
  ov.appendChild(sheet);
  host.innerHTML = "";
  host.appendChild(ov);
}

/* ---------- helpers ---------- */
function pct(score) { return ((score - 1) / 9) * 92 + 4; }
function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt) e.textContent = txt; return e; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function showPanel(which) {
  $("#setupPanel").classList.toggle("hidden", which !== "setup");
  $("#inputPanel").classList.toggle("hidden", which !== "input");
  if (which === "input") { const c = cellAt(0, 0); if (c) setTimeout(() => { c.focus(); c.select(); }, 30); }
}

/* ---------- wiring ---------- */
$("#btnSetup").onclick = () => showPanel($("#setupPanel").classList.contains("hidden") ? "setup" : "none");
$("#btnInput").onclick = () => showPanel($("#inputPanel").classList.contains("hidden") ? "input" : "none");
$("#btnCloseSetup").onclick = () => showPanel("none");
$("#btnDone").onclick = () => { stopStopwatch(); showPanel("none"); render(); window.scrollTo({ top: 0, behavior: "smooth" }); };
$("#addJudge").onclick = () => {
  const id = newId("j", state.judges);
  state.judges.push({ id, name: "Judge " + (state.judges.length + 1) });
  state.teams.forEach(t => state.scores[t.id][id] = null); render();
};
$("#addTeam").onclick = () => {
  const id = newId("t", state.teams);
  state.teams.push({ id, name: "Finalist " + (state.teams.length + 1) });
  state.scores[id] = {}; state.judges.forEach(j => state.scores[id][j.id] = null); render();
};
document.querySelectorAll('#prizeRadio label').forEach(l => {
  l.onclick = () => { if (!Sync.canEdit()) return; state.prize = l.dataset.v; render(); };
});
$("#thresh").oninput = e => { state.threshold = Math.max(1, Math.min(9, +e.target.value || 3)); render(); };
$("#scale").oninput = e => { state.scale = +e.target.value; render(); };
$("#showMean").onchange = e => { state.showMean = e.target.checked; render(); };
$("#clearAll").onclick = () => {
  state.teams.forEach(t => state.judges.forEach(j => state.scores[t.id][j.id] = null));
  state.demo = false; swStart = null; clearInterval(swTimer); $("#sw").textContent = "";
  render(); showPanel("input");
};
$("#copyData").onclick = () => {
  const lines = ["judge\t" + state.teams.map(t => t.name).join("\t")];
  state.judges.forEach(j => lines.push(j.name + "\t" + state.teams.map(t => {
    const v = state.scores[t.id][j.id]; return (typeof v === "number") ? v : "";
  }).join("\t")));
  const txt = lines.join("\n");
  navigator.clipboard && navigator.clipboard.writeText(txt);
  $("#copyData").textContent = "Copied"; setTimeout(() => $("#copyData").textContent = "Copy scores as text", 1200);
};
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { $("#overlayHost").innerHTML = ""; }
});

/* =========================================================================
   SHARED BOARD — one board for everyone who opens the link.
   The server (Cloudflare Worker + D1) holds the authoritative copy. Anyone who opens
   the link can read and edit it. Each browser also keeps its own copy, so a closed
   tab or a dropped connection loses nothing: unsent edits upload when it's back.
   Only the shared fields travel; screen size and panel choices stay per-browser.
   ========================================================================= */
var Sync = (() => {
  const API = "https://wwa-judges-api.wwa-judges-api.workers.dev";
  const META_KEY = "wwa-sync-meta-v1", OLD_PIN_KEY = "wwa-editor-pin";
  const SHARED = ["teams", "judges", "scores", "prize", "threshold"];
  const POLL_MS = 5000;   // free Cloudflare tier: 100k requests/day; hidden tabs stop polling
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
  };
  let meta = (() => { try { return JSON.parse(store.get(META_KEY)) || null; } catch (e) { return null; } })()
             || { version: 0, synced: null };      // synced = shared snapshot at last agreement with the server
  store.set(OLD_PIN_KEY, null);   // editing needs no PIN now; drop one an earlier sign-in left behind
  let uploadTimer = null, inFlight = false, again = false, lastOk = null, online = true;

  const shared = st => JSON.stringify(SHARED.reduce((o, k) => (o[k] = st[k], o), {}));
  const saveMeta = () => store.set(META_KEY, JSON.stringify(meta));
  const dirty = () => meta.synced !== shared(state);

  function status(cls, text) { const e = $("#syncStatus"); if (e) { e.className = "sync-status " + cls; e.textContent = text; } }
  function showStatus() {
    const t = lastOk ? " · " + lastOk.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" }) : "";
    if (!online) return status("err", "Offline — " + (dirty() ? "changes saved on this computer, will upload" : "showing last copy"));
    if (dirty() || inFlight) return status("busy", "Saving…");
    status("ok", "Saved · live" + t);
  }

  /* Adopt the server's copy while keeping this browser's own preferences. */
  function adopt(serverState) {
    SHARED.forEach(k => { if (serverState[k] !== undefined) state[k] = serverState[k]; });
    state.demo = false;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
    render(); applyRole();
  }

  /* Cell-level three-way merge: our edits since the last agreed snapshot, on top of theirs. */
  function mergeOnto(serverState) {
    const base = meta.synced ? JSON.parse(meta.synced) : { teams: [], judges: [], scores: {} };
    const mine = JSON.parse(shared(state));
    const out = JSON.parse(JSON.stringify(serverState));
    ["prize", "threshold"].forEach(k => { if (mine[k] !== base[k]) out[k] = mine[k]; });
    if (JSON.stringify(mine.teams) !== JSON.stringify(base.teams)) out.teams = mine.teams;
    if (JSON.stringify(mine.judges) !== JSON.stringify(base.judges)) out.judges = mine.judges;
    out.scores = out.scores || {};
    out.teams.forEach(t => {
      out.scores[t.id] = out.scores[t.id] || {};
      out.judges.forEach(j => {
        const b = base.scores?.[t.id]?.[j.id], m = mine.scores?.[t.id]?.[j.id];
        if (m !== b && m !== undefined) out.scores[t.id][j.id] = m;
        if (out.scores[t.id][j.id] === undefined) out.scores[t.id][j.id] = null;
      });
    });
    return out;
  }

  async function upload() {
    if (inFlight) { again = true; return; }
    if (!dirty()) { showStatus(); return; }
    inFlight = true; again = false; showStatus();
    const body = shared(state);
    try {
      const r = await fetch(API + "/board", { method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ baseVersion: meta.version, state: JSON.parse(body) }) });
      online = true;
      if (r.ok) { const d = await r.json(); meta = { version: d.version, synced: body }; saveMeta(); lastOk = new Date(); }
      else if (r.status === 409) {                // someone saved first: merge and try again
        const d = await r.json();
        const merged = mergeOnto(d.state);
        meta = { version: d.version, synced: JSON.stringify(SHARED.reduce((o, k) => (o[k] = d.state[k], o), {})) }; saveMeta();
        adopt(merged); again = true;
      } else throw new Error("HTTP " + r.status);
    } catch (e) { online = false; setTimeout(upload, 4000); }
    inFlight = false; showStatus();
    if (again) upload();
  }

  async function poll() {
    if (document.hidden) return;
    try {
      const r = await fetch(API + "/board", { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json(); online = true;
      if (d.version === 0 || !d.state) { upload(); }                     // empty server: the first browser seeds it
      else if (d.version !== meta.version) {
        if (dirty()) { upload(); }                                       // our edits win cell-by-cell via 409 merge
        else if (!document.activeElement || !document.activeElement.closest("#matrix, #teamList, #judgeList")) {
          meta = { version: d.version, synced: JSON.stringify(SHARED.reduce((o, k) => (o[k] = d.state[k], o), {})) }; saveMeta();
          adopt(d.state);
        }
      } else if (dirty()) upload();
      if (!lastOk && d.updated) lastOk = new Date(d.updated);
    } catch (e) { online = false; }
    showStatus();
  }

  function applyRole() {
    document.querySelectorAll("#matrix input, #judgeList input, #teamList input, #judgeList .x, #teamList .x, #addJudge, #addTeam, #clearAll, #thresh, #prizeRadio input")
      .forEach(e => { e.disabled = false; });
    const n = $("#inputPanel .note"); if (n) n.textContent =
      "Enter scores from 1 to 10. Use Tab or Enter to move between cells. Every entry saves online.";
  }

  return {
    start() { applyRole(); showStatus(); poll(); setInterval(poll, POLL_MS);
              window.addEventListener("online", () => { online = true; poll(); });
              document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); }); },
    onLocalChange() { clearTimeout(uploadTimer); uploadTimer = setTimeout(upload, 400); showStatus(); },
    canEdit: () => true,
    applyRole
  };
})();

/* ---------- boot ---------- */
const tests = runSelfTests();
const failed = tests.filter(t => !t.pass);
$("#selftest").className = "selftest" + (failed.length ? " fail" : "");
$("#selftest").textContent = failed.length
  ? ("self-test FAILED: " + failed.map(t => t.name).join("; "))
  : ("self-test ✓ " + tests.length + " checks");
if (failed.length) console.error("SELF-TEST FAILURES", failed);

render();
if (!Tally.computeTally({teams:state.teams,judges:state.judges,scores:state.scores,redThreshold:state.threshold}).complete) {
  showPanel("input");
}
Sync.start();
</script>
